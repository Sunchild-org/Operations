<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driven Operations Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230f1a33'/%3E%3Cg fill='none' stroke='%23dcb15e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='5' r='2.2'/%3E%3Cpath d='M12 7.2V20M8 10.5h8M5.5 14a6.5 6.5 0 0 0 13 0'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#0f172a;--mute:#66728c;--line:#e3e6ee;--soft:#eef0f6;--acc:#1c2a4e;--gold:#b8862b;--on:#fff;--good:#2b7a4b;--bad:#b4381f;--sh:0 1px 2px rgba(15,23,42,.06),0 10px 28px -14px rgba(15,23,42,.22);--serif:Fraunces,Georgia,serif}
@media(prefers-color-scheme:dark){:root{--bg:#0a0f1d;--card:#121a2e;--ink:#e9ecf5;--mute:#8d99b3;--line:#232d47;--soft:#1a2440;--acc:#dcb15e;--gold:#dcb15e;--on:#0a0f1d;--good:#5cc08a;--bad:#ff8f72;--sh:0 10px 28px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html{scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.top{background:#0f1a33;color:#fff;position:sticky;top:0;z-index:6;box-shadow:0 1px 0 rgba(220,177,94,.35)}
.top div{max-width:1000px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
.mk{color:#dcb15e;flex:none}
.br{font:700 1.2rem var(--serif);letter-spacing:2px}.br small{font:400 .8rem Inter,sans-serif;opacity:.65;margin-left:6px}
.top nav{margin-left:auto;display:flex;gap:4px}
.top a{color:#c9d1e6;text-decoration:none;padding:7px 13px;border-radius:99px;font-weight:500;font-size:.9rem}
.top a.on{background:rgba(255,255,255,.12);color:#fff}
main{max-width:1000px;margin:0 auto;padding:26px 18px 80px}
h1{font:700 2rem/1.15 var(--serif);margin:0 0 4px}
h2{font:600 1.3rem var(--serif);margin:30px 0 10px}
h3{font-size:.95rem;margin:20px 0 6px;font-weight:600}
.sub{color:var(--mute);margin:0 0 14px}
.b{padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:500;cursor:pointer;transition:.15s}
.b:hover{border-color:var(--gold)}
.b.pri{background:var(--acc);color:var(--on);border-color:var(--acc)}
.b.dng{color:var(--bad)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.stat,.box,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.stat{padding:16px 18px}.stat b{display:block;font:700 2.1rem/1.1 var(--serif);color:var(--acc)}.stat span{font-size:.82rem;color:var(--mute)}
.box{padding:6px 20px 20px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{display:block;text-align:left;padding:18px;color:inherit;font:inherit;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.card .n{font:600 1.1rem var(--serif);display:block;margin-bottom:2px}
.m{color:var(--mute);font-size:.85rem}
.badge{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--acc);font-weight:600;margin-left:6px;vertical-align:2px}
.meter{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.note{background:var(--soft);border-radius:12px;padding:11px 14px;font-size:.88rem;color:var(--mute);margin:16px 0}
.warn{border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--card);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:.9rem}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
textarea{min-height:64px;resize:vertical;overflow:hidden}
textarea.tall{overflow:auto;min-height:120px}
textarea.bulk{min-height:110px;margin:6px 0 10px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;padding:0;border:1.5px solid var(--mute);border-radius:7px;display:grid;place-content:center;flex:none;cursor:pointer;transition:.15s;print-color-adjust:exact}
input[type=checkbox]:checked{background:var(--gold);border-color:var(--gold)}
input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.title{font:700 1.9rem/1.2 var(--serif);border:0;border-bottom:2px solid transparent;border-radius:0;padding:4px 0;background:none;margin-bottom:6px}
.title:focus{outline:0;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
label.f{display:block;font-size:.82rem;color:var(--mute);font-weight:500}label.f input,label.f select,label.f textarea{margin-top:4px;color:var(--ink)}
.tabbar{position:sticky;top:53px;z-index:4;background:var(--bg);margin:0 -18px 6px;padding:8px 18px 6px}
.tabs{display:flex;background:var(--soft);padding:4px;border-radius:12px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.tabbar .tabs{display:flex}
.tab{padding:8px 15px;border:0;background:none;color:var(--mute);font:inherit;font-weight:500;cursor:pointer;border-radius:9px;white-space:nowrap;position:relative}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:2px}
.tabs.sm{display:inline-flex;margin:0}
.panel{display:none}.panel.show{display:block}
.panel>h2:first-child{margin-top:14px}
.ph{display:flex;align-items:center;gap:6px;margin:24px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.ph input{border:0;background:none;font:600 1.02rem var(--serif);padding:2px 0}.ph input:focus{outline:0}
.ck,.lr{display:flex;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.ck input.it,.lr input{border:0;background:none;padding:3px 0;border-radius:0}.lr input{border-bottom:1px solid var(--line);padding:8px 2px}
.ck input.it:focus{outline:0}
.ck input:checked+input.it{color:var(--mute);text-decoration:line-through}
.x{border:0;background:none;color:var(--mute);font-size:1.3rem;line-height:1;cursor:pointer;padding:2px 8px;border-radius:8px}.x:hover{color:var(--bad);background:var(--soft)}
.lnk{border:0;background:none;color:var(--gold);font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;padding:8px 2px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
table.mini{min-width:520px}
th{background:var(--soft);text-align:left;padding:9px 10px;font-weight:600;color:var(--mute);font-size:.8rem;white-space:nowrap}
td{border-top:1px solid var(--line);padding:2px;vertical-align:middle}
td input,td select{border:0;background:transparent;padding:9px 8px;min-width:84px;border-radius:6px}td input[type=checkbox]{margin:auto;min-width:0}
td input[type=time]{min-width:104px}
input.amt{text-align:right;font-variant-numeric:tabular-nums}
td.vr{font-size:.8rem;white-space:nowrap;padding:2px 10px;color:var(--mute)}
[data-s=bad]{color:var(--bad)!important}[data-s=ok]{color:var(--good)!important}
.rt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.rt select{width:auto}
.empty{text-align:center;padding:44px 16px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:16px}
.pnt{display:none}
.dets{margin:6px 0 12px;border:1px solid var(--line);border-radius:12px;padding:4px 14px;background:var(--card)}
.dets summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--acc)}
.dayc{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 18px 16px;margin:0 0 16px}
.dayh{display:flex;gap:10px;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--gold)}
.dayh input{width:auto}.dayh .dl{flex:1;border:0;background:none;font:600 1.1rem var(--serif);padding:2px 0}.dayh .dl:focus{outline:0}.dayh input[type=date]{max-width:170px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--soft)}
.tile b{display:block;font:700 1.5rem/1.15 var(--serif);color:var(--acc);overflow-wrap:anywhere;min-height:1.7rem}
.tile span{font-size:.72rem;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.tb{padding-bottom:16px}
.bkp{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* report */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:38px 44px;margin-top:14px}
.rpt{display:none}.rpt.show{display:block}
.r-head{border-bottom:3px solid var(--gold);padding-bottom:18px;margin-bottom:6px}
.r-org{font:600 .72rem Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.r-head h1{font:700 2.1rem/1.12 var(--serif);margin:10px 0 4px}
.r-sub{font:600 1.1rem var(--serif);color:var(--mute)}
.r-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;margin:18px 0 0}
.r-meta dt{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.r-meta dd{margin:2px 0 0;font-weight:600;font-size:.92rem}
.r-sec{margin-top:32px}
.r-sec h2{display:flex;align-items:baseline;gap:12px;font:600 1.35rem var(--serif);margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line);break-after:avoid}
.r-sec h2 span{font:600 .78rem Inter,sans-serif;color:var(--gold);letter-spacing:.12em}
.r-sec h3{font:600 1.02rem var(--serif);margin:22px 0 8px;break-after:avoid}
.r-sec p{margin:0 0 10px}
.r-day{margin:0 0 24px}
.rtbl{width:100%;min-width:0;border-collapse:collapse;font-size:.84rem}
.rtbl th{background:var(--soft);padding:8px 10px;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:normal}
.rtbl td{border-top:1px solid var(--line);padding:7px 10px;vertical-align:top}
.rtbl .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rtbl tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.rtbl td small{color:var(--mute);display:block}
.sh{display:inline-block;width:70px;height:6px;border-radius:9px;background:var(--soft);vertical-align:middle;margin-right:8px;overflow:hidden}
.sh i{display:block;height:100%;background:var(--gold)}
.names{columns:2;column-gap:30px;padding-left:28px;margin:6px 0;font-size:.88rem}.names li{break-inside:avoid;padding:1px 0}
.callout{border-left:4px solid var(--gold);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.callout b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.tag{display:inline-block;font-size:.68rem;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--acc);white-space:nowrap}
.tag.bad{color:var(--bad)}.tag.ok{color:var(--good)}
.r-foot{margin-top:36px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:.8rem}
.r-empty{margin:26px 0;padding:26px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:22px}
.signs div{border-top:1px solid var(--ink);padding-top:6px;font-size:.82rem;color:var(--mute)}.signs b{display:block;color:var(--ink);font-size:.92rem}
@media(max-width:600px){.title{font-size:1.35rem}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}h1{font-size:1.65rem}.br small{display:none}.sheet{padding:22px 18px;border-radius:14px}.r-head h1{font-size:1.6rem}.names{columns:1}.signs{grid-template-columns:1fr}.dayh{flex-wrap:wrap}}
@media print{
 @page{margin:14mm}
 :root{--bg:#fff;--card:#fff;--ink:#000;--mute:#555;--line:#ccc;--soft:#f2f2f2;--acc:#1c2a4e;--gold:#b8862b;--good:#2b7a4b;--bad:#b4381f;--sh:none}
 body{background:#fff;color:#000;font-size:10.5pt}main{padding:0;max-width:none}
 .top,.noprint,.tabs,.tabbar{display:none!important}.pnt{display:block;font:700 1.1rem var(--serif);margin-bottom:6px}
 .panel{display:block!important}.pb{break-before:page}
 body.rep .panel:not(.rp){display:none!important}body:not(.rep) .panel.rp{display:none!important}body.rep .pnt{display:none}
 .rpt{display:block!important}.rpt.pb{break-before:page}
 .sheet{border:0;box-shadow:none;padding:0;margin:0;border-radius:0}
 input,select,textarea{border:0;border-bottom:1px solid #aaa;border-radius:0;background:none;color:#000;padding:3px}
 .ck input.it{border:0}.tw,.card,.warn,.dayc,.box,.tile{box-shadow:none;border-color:#aaa}
 h2,.ph{break-after:avoid}.ck,tr,.tile{break-inside:avoid}table{min-width:0}.tw{overflow:visible}
 thead{display:table-header-group}.rtbl td,.rtbl th{padding:5px 7px}
}
</style>
</head>
<body>
<header class="top"><div><svg class="mk" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V22M8 11h8M5 15a7 7 0 0 0 14 0M3 13l2 2M21 13l-2 2"/></svg><span class="br">DRIVEN<small>Operations Hub</small></span><nav><a href="#/" id="n1">Programmes</a><a href="#/settings" id="n2">Settings</a></nav></div></header>
<main id="app"></main>
<input type="file" id="imp" accept="application/json" hidden>
<script>
const KEY='driven-ops-hub-v2';
const TPL=[
['4 weeks before',['Programme approved and objective defined','Date, time and platform or venue confirmed','Programme lead and unit contacts named','Budget estimated and approved (skip if no cost)','Task list created and owners assigned']],
['2 weeks before',['Programme flow (run order) drafted and shared with all units','Speakers, facilitators and MC confirmed','Announcement sent to members with registration or link details','Materials requested (slides, handouts, documents)','Physical events: venue, transport, accommodation and feeding arranged','Physical events: venue confirmed in writing, inspected, with a backup venue identified (2 to 3 weeks out at the latest)']],
['1 week before',['Every department has its briefing and resources','Reminder sent to members and participants','Backup plan written (alternate platform, backup speaker, power or data issue)','Team budgets released and each team knows to keep receipts']],
['3 days before',['Rehearsal or test run completed','Final run order sent to every department and speaker','All owners confirm their tasks are on track']],
['Day before',['Final reminder sent','Materials, equipment and links checked','Quick call or message to department contacts to confirm readiness']],
['Day of programme',['Team joins or arrives early (at least 30 minutes)','Final check done','Setup finished at least 15 minutes before each session','Programme starts on time','Attendance recorded','Issues noted live in the issues log','Programme ends on time and closing logistics done']],
['Within 48 hours after',['Thank-you message sent to speakers, volunteers and attendees','Recording, minutes and documents filed in the shared folder','Spending reports and unspent funds returned to Finance','Feedback form sent to attendees','Post-programme review scheduled']]
];
const UNITS=['Technical','Secretariat','Welfare','Venue Management and Sanitation',"Labourers' Directorate",'Health and Nutrition','Ushering','Protocol','Media','Music','Marketing','Programmes','Prayer','Counselling'];
const dflt=()=>({units:UNITS.map((n,i)=>({id:'u'+i,n})),areas:['Preparation and planning','Communication between departments','Delivery on the day','Documentation','Member care','Participant satisfaction'].map((n,i)=>({id:'a'+i,n})),formats:['Online','Physical','Hybrid'],statuses:['Not started','In progress','Done','Blocked'],tpl:TPL.map(([p,i])=>({p,i:[...i]})),cur:'₦',org:'Driven',unitsV3:true});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.programmes))S={programmes:[]};
if(S.cfg&&!S.cfg.unitsV3&&Array.isArray(S.cfg.units)&&S.cfg.units.length===3&&S.cfg.units.every((u,i)=>u&&u.id==='u'+i))S.cfg.units=S.cfg.units.concat(dflt().units.slice(3));
S.cfg=Object.assign(dflt(),S.cfg,{unitsV3:true});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const issue=()=>({issue:'',cause:'',fix:'',owner:'',deadline:'',repeat:false,done:false});
const newRv=()=>({start:'',end:'',met:'',late:'',aatt:'',rate:{},ur:{},issues:[issue(),issue()],bp:'',ba:'',wl:'',fb:'',keep:'',chg:'',tpl:'',by:'',shared:'',done:false});
const sess=()=>({ps:'',as:'',pe:'',ae:'',t:'',who:'',n:''});
const newDay=l=>({id:uid(),l:l||'',d:'',s:[sess(),sess()],sum:''});
const newFin=()=>({open:'',int:'',bank:'',c:[],r:[],p:[],ch:[],ti:{},tx:{},note:''});
const newVenue=()=>({name:'',loc:'',acc:'',vc:'',ac:'',tl:[],bk:'',chg:'',chgd:'',su:'',sd:'',fs:'',les:''});
const norm=p=>{p.ct=p.ct||{};p.br=p.br||{};p.cl=p.cl||[];p.tasks=p.tasks||[];p.notes=p.notes||'';p.end=p.end||'';p.theme=p.theme||'';p.sum=p.sum||'';
 p.days=Array.isArray(p.days)?p.days:[];p.days.forEach(d=>{if(!Array.isArray(d.s))d.s=[]});p.ad=Array.isArray(p.ad)?p.ad:[];p.people=p.people||'';p.anote=p.anote||'';
 p.venue=Object.assign(newVenue(),p.venue);if(!Array.isArray(p.venue.tl))p.venue.tl=[];
 p.fin=Object.assign(newFin(),p.fin);['c','r','p','ch'].forEach(k=>{if(!Array.isArray(p.fin[k]))p.fin[k]=[]});['ti','tx'].forEach(k=>{if(!p.fin[k]||typeof p.fin[k]!=='object')p.fin[k]={}});
 p.rv=Object.assign(newRv(),p.rv)};
S.programmes.forEach(norm);
let cur=null,view='home',tab='plan',rtab='prog',q='',warned=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=(o,k)=>k.split('.').reduce((a,b)=>a==null?'':a[b],o);
const set=(o,k,v)=>{const a=k.split('.'),l=a.pop();let x=o;for(const p of a){if(x[p]==null)x[p]={};x=x[p]}x[l]=v};
const save=()=>{S.changed=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!warned){warned=true;alert('Could not save in this browser. Use Export to keep a backup.')}}};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'No date set';
const fmtL=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
const rng=p=>!p.date?'':(p.end&&p.end!==p.date?fmt(p.date)+' to '+fmt(p.end):fmt(p.date));
const slug=s=>(String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))||'programme';
const task=()=>({task:'',owner:'',unit:'',deadline:'',status:S.cfg.statuses[0]||''});
const prog=p=>{let t=0,d=0;p.cl.forEach(x=>x.i.forEach(i=>{t++;if(i.d)d++}));return{t,d,pc:t?Math.round(100*d/t):0}};
function newProg(){return{id:uid(),created:Date.now(),name:'',date:'',end:'',theme:'',format:S.cfg.formats[0]||'',lead:'',att:'',obj:'',notes:'',sum:'',ct:{},br:{},
 cl:S.cfg.tpl.map(x=>({p:x.p,i:x.i.map(t=>({t,d:false}))})),tasks:[task(),task(),task(),task()],days:[],ad:[],people:'',anote:'',venue:newVenue(),fin:newFin(),rv:newRv()}}
function openFixes(skip){const r=[];S.programmes.forEach(p=>p.rv.issues.forEach((x,i)=>{if(p.id!==skip&&(x.issue||x.fix)&&!x.done)r.push({pid:p.id,pn:p.name||'Untitled',i,...x})}));return r}

function reportHTML(p){return`<div class="rpt rp-prog${rtab==='prog'?' show':''}">${progReport(p)}</div><div class="rpt rp-fin pb${rtab==='fin'?' show':''}">${finReport(p)}</div>`}

 $('#app').innerHTML=view==='set'?settings():cur?detail(cur):home();
 document.body.classList.toggle('rep',view==='prog'&&tab==='report');
 $('#n1').className=view==='set'?'':'on';$('#n2').className=view==='set'?'on':'';

const fit=()=>document.querySelectorAll('textarea').forEach(t=>{t.style.height='auto';const h=t.scrollHeight;t.style.height=(t.classList.contains('tall')?Math.min(h,380):h)+'px'});
function dl(name,type,data){const u=URL.createObjectURL(new Blob([data],{type})),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function dlReport(){const old=rtab;const inner=reportHTML(cur),css=document.querySelector('style').textContent;
 const light=':root{--bg:#f4f5f8;--card:#fff;--ink:#0f172a;--mute:#66728c;--line:#e3e6ee;--soft:#eef0f6;--acc:#1c2a4e;--gold:#b8862b;--good:#2b7a4b;--bad:#b4381f}body{background:var(--bg)}.rpt{display:block!important}.rpt+.rpt{margin-top:40px;padding-top:30px;border-top:1px dashed var(--line)}main{padding-top:22px}.dlbar{max-width:1000px;margin:18px auto 0;padding:0 18px;display:flex;justify-content:space-between;align-items:center}';

addEventListener('hashchange',()=>{scrollTo(0,0);render()});addEventListener('beforeprint',fit);
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='srch'){q=t.value;$('#list').innerHTML=list();return}

 calc()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;
 const d=b.dataset,a=d.a,C=S.cfg,go=()=>{save();render()},fin=cur&&cur.fin;
 if(a==='new'){const p=newProg();S.programmes.push(p);save();tab='plan';location.hash='#/p/'+p.id}
 else if(a==='open'){tab='plan';location.hash='#/p/'+d.id}
 else if(a==='back')location.hash='#/';
 else if(a==='tab'){tab=d.t;render()}
 else if(a==='rtab'){rtab=d.t;render()}

 else if(a==='tpladdph'){const s=prompt('Name of the new phase');if(s&&s.trim()){C.tpl.push({p:s.trim(),i:[]});go()}}
 else if(a==='tpldelph'){if(confirm('Remove this phase from the template?')){C.tpl.splice(+d.p,1);go()}}
